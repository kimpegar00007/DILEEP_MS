; PHP settings for cPanel / PHP-FPM / LiteSpeed hosts (read per directory, applies to subfolders).
; The php_value lines in .htaccess only work under mod_php, which shared hosting rarely uses.

; Session cookie hardening
session.cookie_httponly = 1
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_samesite = "Lax"
; dileepsys.com is HTTPS-only (http:// redirects), so the cookie is never sent in clear text.
; Local XAMPP/php -S ignore .user.ini, so local http:// logins keep working.
session.cookie_secure = 1

; Never show PHP errors to visitors in production
display_errors = Off
log_errors = On
date.timezone = "Asia/Manila"
